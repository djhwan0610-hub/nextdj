<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대전환네트워크 | 유튜브 · SNS</title>
  <meta name="description" content="대전환네트워크의 유튜브 영상과 SNS 채널 모음입니다.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="index.html">대전환네트워크<small>(가칭)</small></a>
    <nav class="menu">
      <a href="index.html">단체 소개</a>
      <a href="activities.html">활동 및 참가</a>
      <a class="active" href="media.html">유튜브 · SNS</a>
    </nav>
  </div>
</header>

<div class="hero small">
  <div class="wrap">
    <h1>유튜브 · SNS</h1>
    <p class="lead">영상과 소식을 가장 빠르게 만나 보세요.</p>
  </div>
</div>

<section id="youtube">
  <div class="wrap">
    <h2>유튜브</h2>
    <p class="sub">대표 영상을 소개합니다.</p>

    <div class="video">
      <!-- 수정: 아래 div를 지우고, 이 한 줄의 영상 ID(VIDEO_ID)만 바꿔 넣으세요.
      <iframe src="https://www.youtube.com/embed/VIDEO_ID" title="대전환네트워크 소개 영상" allowfullscreen></iframe>
      -->
      <div>
        <div style="font-size:2rem">▶</div>
        <div>영상 준비 중입니다</div>
      </div>
    </div>

    <p style="margin-top:18px"><a class="btn primary" href="#" id="yt-channel">유튜브 채널 바로가기</a></p>
    <!-- 수정: href="#"를 실제 유튜브 채널 주소로 교체 -->
  </div>
</section>

<section class="alt" id="sns">
  <div class="wrap">
    <h2>SNS 채널</h2>
    <p class="sub">원하는 채널에서 소식을 받아보세요.</p>
    <div class="grid three sns">
      <a class="card" href="#"><!-- 수정: 페이스북 주소 -->
        <div class="name">페이스북</div>
        <p>활동 소식과 행사 안내</p>
      </a>
      <a class="card" href="#"><!-- 수정: 인스타그램 주소 -->
        <div class="name">인스타그램</div>
        <p>카드뉴스와 현장 사진</p>
      </a>
      <a class="card" href="#"><!-- 수정: 카카오톡 채널 또는 오픈채팅 주소 -->
        <div class="name">카카오톡</div>
        <p>소식 알림과 문의</p>
      </a>
    </div>
    <div class="note">각 채널 주소는 개설되는 대로 연결합니다.</div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <strong>대전환네트워크 (가칭)</strong><br>
    문의: <a href="mailto:example@example.com">example@example.com</a> <!-- 수정: 실제 이메일 -->
    <br>© 2026 대전환네트워크. All rights reserved.
  </div>
</footer>

</body>
</html>
